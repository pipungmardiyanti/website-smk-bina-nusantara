<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Admin SPMB 2027/2028</title>
<style>
*{box-sizing:border-box}
body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:Arial,Helvetica,sans-serif;
    background:linear-gradient(135deg,#eaf4ff,#f7fbff);
}
.card{
    width:min(440px,92%);
    background:#fff;
    border-radius:22px;
    padding:38px;
    box-shadow:0 18px 50px rgba(0,65,120,.15);
}
.logo{
    width:76px;
    height:76px;
    margin:0 auto 18px;
    border-radius:20px;
    background:linear-gradient(135deg,#084c91,#119bd2);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:34px;
    font-weight:800;
}
h1{
    margin:0;
    text-align:center;
    color:#084c91;
    font-size:28px;
}
.sub{
    text-align:center;
    color:#65788c;
    margin:8px 0 28px;
}
label{
    display:block;
    margin:15px 0 7px;
    color:#24415e;
    font-weight:700;
}
input{
    width:100%;
    padding:14px 15px;
    border:1px solid #cbdbea;
    border-radius:12px;
    font-size:16px;
    outline:none;
}
input:focus{
    border-color:#138dcc;
    box-shadow:0 0 0 3px rgba(19,141,204,.12);
}
button{
    width:100%;
    margin-top:24px;
    padding:15px;
    border:0;
    border-radius:12px;
    background:linear-gradient(90deg,#084c91,#1099d0);
    color:#fff;
    font-size:17px;
    font-weight:800;
    cursor:pointer;
}
button:disabled{opacity:.65;cursor:wait}
.msg{
    min-height:22px;
    margin-top:15px;
    text-align:center;
    font-weight:700;
    color:#d32f2f;
}
.back{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#126fa8;
    text-decoration:none;
}
.note{
    margin-top:20px;
    padding:11px;
    border-radius:10px;
    background:#fff8d8;
    color:#6d5a00;
    font-size:13px;
    line-height:1.5;
}
</style>
</head>
<body>

<div class="card">
    <div class="logo">🔐</div>

    <h1>ADMIN SPMB</h1>
    <div class="sub">SPMB 2027/2028 · SMK Bina Nusantara Kebumen</div>

    <form id="loginForm">
        <label for="username">Username</label>
        <input id="username" autocomplete="username" required>

        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required>

        <button id="btnLogin" type="submit">MASUK ADMIN</button>

        <div id="msg" class="msg"></div>
    </form>

    <a class="back" href="/">← Kembali ke Website</a>

    <div class="note">
        Halaman data pendaftar hanya dapat dibuka setelah login admin.
    </div>
</div>

<script>
(async function(){
    try{
        const r = await fetch("/api/admin/status",{cache:"no-store"});
        const d = await r.json();
        if(d.loggedIn){
            location.href="/admin.html";
        }
    }catch(e){}
})();

document.getElementById("loginForm").addEventListener("submit", async function(e){
    e.preventDefault();

    const btn = document.getElementById("btnLogin");
    const msg = document.getElementById("msg");

    btn.disabled = true;
    msg.textContent = "";

    try{
        const response = await fetch("/api/admin/login",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({
                username:document.getElementById("username").value.trim(),
                password:document.getElementById("password").value
            })
        });

        const data = await response.json();

        if(data.ok){
            location.href="/admin.html";
            return;
        }

        msg.textContent = data.message || "Login gagal.";
    }catch(error){
        msg.textContent = "Server tidak dapat dihubungi.";
    }finally{
        btn.disabled = false;
    }
});
</script>

</body>
</html>
